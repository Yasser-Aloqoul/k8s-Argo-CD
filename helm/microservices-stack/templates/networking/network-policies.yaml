  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microservices-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: employee
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
