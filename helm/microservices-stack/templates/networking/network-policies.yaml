{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microservices-stack.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microservices-stack.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microservices-stack.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.dns.namespace }}
          podSelector:
            matchLabels:
              {{ .Values.networkPolicies.dns.podLabelKey }}: {{ .Values.networkPolicies.dns.podLabelValue | quote }}
      ports:
        - protocol: UDP
          port: {{ .Values.networkPolicies.dns.port }}
        - protocol: TCP
          port: {{ .Values.networkPolicies.dns.port }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubernetes-api-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microservices-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - admin
          - employee
          - department
          - organization
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: {{ required "networkPolicies.kubernetesApi.cidr is required" .Values.networkPolicies.kubernetesApi.cidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicies.kubernetesApi.port }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-allow-backends
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microservices-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - employee
                  - department
                  - organization
      ports:
        - protocol: TCP
          port: {{ .Values.mongodb.port }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
