{{- $root := . -}}
{{- range $name, $service := .Values.spring.services }}
{{- if $service.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "microservices-stack.labels" $root | nindent 4 }}
    app: {{ $name }}
    app.kubernetes.io/component: {{ $name }}
    {{- if ne $name "admin" }}
    spring.cloud.kubernetes.config: "true"
    {{- end }}
data:
  {{- if eq $name "admin" }}
  application.yml: |-
    spring:
      cloud:
        kubernetes:
          discovery:
            service-labels:
              spring-boot: true
  {{- else }}
  application.properties: |-
    spring.mongodb.host: mongodb
    spring.mongodb.database: {{ $root.Values.mongodb.auth.database }}
    spring.mongodb.authentication-database: {{ $root.Values.mongodb.auth.database }}
  {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "microservices-stack.labels" $root | nindent 4 }}
    app: {{ $name }}
    app.kubernetes.io/component: {{ $name }}
    {{- if ne $name "admin" }}
    spring-boot: "true"
    {{- end }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "microservices-stack.labels" $root | nindent 4 }}
    app: {{ $name }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/name: {{ include "microservices-stack.name" $root }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        checksum/config: {{ printf "%s:%s" $name $root.Values.mongodb.auth.database | sha256sum }}
        {{- if ne $name "admin" }}
        checksum/auth: {{ printf "%s:%s:%s" $root.Values.mongodb.auth.username $root.Values.mongodb.auth.password $root.Values.mongodb.auth.existingSecret | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "microservices-stack.serviceAccountName" $root }}
      containers:
        - name: {{ $name }}
          image: "{{ $service.image.repository }}:{{ $service.image.tag }}"
          imagePullPolicy: {{ $root.Values.spring.imagePullPolicy }}
          resources:
            {{- toYaml $root.Values.spring.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: {{ $root.Values.spring.probes.startup.path }}
              port: http
              scheme: HTTP
            periodSeconds: {{ $root.Values.spring.probes.startup.periodSeconds }}
            timeoutSeconds: {{ $root.Values.spring.probes.startup.timeoutSeconds }}
            failureThreshold: {{ $root.Values.spring.probes.startup.failureThreshold }}
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: {{ $root.Values.spring.probes.readiness.path }}
              port: http
              scheme: HTTP
            periodSeconds: {{ $root.Values.spring.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $root.Values.spring.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $root.Values.spring.probes.readiness.failureThreshold }}
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: {{ $root.Values.spring.probes.liveness.path }}
              port: http
              scheme: HTTP
            periodSeconds: {{ $root.Values.spring.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $root.Values.spring.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $root.Values.spring.probes.liveness.failureThreshold }}
            successThreshold: 1
          env:
            - name: SPRING_APPLICATION_NAME
              value: {{ $name | quote }}
            - name: SPRING_CONFIG_IMPORT
              value: "kubernetes:"
            - name: JAVA_TOOL_OPTIONS
              value: {{ $root.Values.spring.javaToolOptions | quote }}
            {{- if ne $name "admin" }}
            - name: SPRING_MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservices-stack.mongodbSecretName" $root }}
                  key: database-user
            - name: SPRING_MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservices-stack.mongodbSecretName" $root }}
                  key: database-password
            {{- end }}
---
{{- end }}
{{- end }}
